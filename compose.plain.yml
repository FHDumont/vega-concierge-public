name: vega
# Vega Concierge — workshop stack. DIRECT ports on the VM (no Traefik).
# Run stack with no backend instrumentation (F-049/ADR-026 — app blind on the server).
#
# Images ALREADY PUBLISHED on GHCR (pull, NOT build — see CONVENCOES › "Docker image builds —
# CI only"). To develop locally use docker-compose.yml (with build + hot reload).
# Image/tag controllable via env (default owner fhdumont, tag latest): IMAGE_OWNER / IMAGE_TAG.
services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:-fhdumont}/${BACKEND_IMAGE:-vega-backend}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always
    # Per-VM config contract (F-BACKEND-3 → F-REAL-ENV-2): the container receives the
    # EFFECTIVE environment via `.env.runtime`, generated by scripts/up.sh as an OS > .env
    # merge — that's how variables injected into the OS by the replica (Ansible) get in here.
    # `environment:` below is only for values that need to be DIFFERENT inside the container
    # (`environment:` wins over `env_file`, so these overrides stay immune to the merge).
    env_file:
      - path: .env.runtime
        required: false
    environment:
      - ORDERS_DB=/data/vega.db # SQLite on a named volume (DT-006): survives container recreation
      - VEGA_PERSIST_DIR=/persist
      # RAG (ADR-031): internal URL @postgres — host/setup_vectordb uses localhost in .env.
      - RAG_DATABASE_URL=postgresql+psycopg://${RAG_DB_USER:-vega}:${RAG_DB_PASSWORD:-vega}@postgres:5432/${RAG_DB_NAME:-vega_rag}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RAG_ENABLED=${RAG_ENABLED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    volumes:
      - vega-db:/data
      - ./backend/.vega-persist:/persist

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-fhdumont}/vega-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always
    environment:
      # The browser talks DIRECTLY to the API (ADR-024). Without Traefik, the API is the VM's IP:port.
      # Since the attendee accesses it by IP, PUBLIC_API_BASE must point to the SAME host that served
      # the store: we leave it empty → the frontend resolves the API via the browser's origin on port
      # 8000 (runtime fallback). To pin it, set PUBLIC_API_BASE=http://<VM-IP>:8000 in .env.
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://backend:8000}
    ports: ["3000:3000"]
    depends_on: [backend]

  # pgvector — real embeddings for RAG (ADR-031). Profile `rag`: outside the default stack, because
  # the in-process keyword retriever already works with no database. Stores only vectors; transactional
  # state stays in SQLite (ADR-008).
  postgres:
    profiles: [rag]
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_USER=${RAG_DB_USER:-vega}
      - POSTGRES_PASSWORD=${RAG_DB_PASSWORD:-vega}
      - POSTGRES_DB=${RAG_DB_NAME:-vega_rag}
    # Production: compose-internal network only — backend @postgres:5432; index via rag-init (docker one-off).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-vega} -d ${RAG_DB_NAME:-vega_rag}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - vega-vectors:/var/lib/postgresql/data

volumes:
  vega-db: # persistence for the orders SQLite across container recreations (DT-006)
  vega-vectors: # pgvector embeddings (profile `rag`)
