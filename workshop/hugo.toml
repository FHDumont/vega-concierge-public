# workshop/hugo.toml — Vega Concierge workshop guide.
#
# Run locally from this folder:
#     hugo server
# Build the static site:
#     hugo --minify
#
# Theme is vendored under workshop/themes/hugo-theme-splunk-workshop
# (splunk/hugo-theme-splunk-workshop). Sync from upstream main when refreshing shortcodes.

baseURL = "https://example.org/"
locale  = "en-us"
title   = "Vega Concierge · Workshop"
defaultContentLanguage = "en"
enableEmoji     = true
enableRobotsTXT = true
enableGitInfo   = true
theme   = "hugo-theme-splunk-workshop"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false
  [markup.highlight]
    noClasses   = false
    lineNos     = false
    codeFences  = true
    guessSyntax = true
    tabWidth    = 2

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

# ============================================================================
# Theme parameters. Splunk brand kept as-is (this is a Splunk .conf workshop);
# only identity/copy is rebranded for Vega Concierge.
# ============================================================================
[params]
  # ---- Identity ----
  brandName    = "splunk>"
  brandTagline = "workshops"
  description  = "Hands-on: shop the store, run five Splunk Agent Observability use cases, optional Splunk o11y — traces, evaluators, Protect."
  copyright    = "&copy; {year} Splunk — workshop material. Vega Concierge is a teaching demo."
  logoLight    = "images/splunk-logo-black.png"
  logoDark     = "images/splunk-logo-white.png"
  logoHeight   = "40"
  favicon      = "favicon.svg"

  # ---- Hero background (the brand "light trails" bloom) ----
  heroBackgroundLight = "images/background_Splunk-light-mode2_16x9.webp"
  heroBackgroundDark  = "images/background_Splunk-dark-mode2_16x9.webp"

  # ---- Mode ----
  defaultMode     = "auto"
  showThemeToggle = true

  # ---- Typography (Splunk Data Sans Pro + JetBrains Mono) ----
  splunkDataSansPro = true
  fontUrl     = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
  fontDisplay = "'Splunk Data Sans Pro', ui-sans-serif, system-ui, sans-serif"
  fontBody    = "'Splunk Data Sans Pro', ui-sans-serif, system-ui, sans-serif"
  fontMono    = "'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"

  # ---- Layout toggles ----
  showSidebar     = true
  showToc         = true
  showProgress    = true
  showLightTrails = true
  contentMaxWidth = "880px"

  # ---- Splunk brand palette (aligned with observability-workshop) ----
  colorAccent         = "#FF007F"
  colorAccent2        = "#FF9000"
  colorAccent3        = "#FFAB0F"
  colorAccentDark     = "#D4006B"
  colorAccentText     = "#BD0D5F"
  colorAccentTextDark = "#FF7DBA"
  colorInk            = "#0C1724"
  colorInkMuted       = "#585B61"
  colorPaper          = "#FFFFFF"
  colorSurface        = "#F4F6FA"
  colorSurfaceAlt     = "#E9EDF2"
  colorBorder         = "#E1E5EC"
  colorInkMutedDark   = "#9CA3AF"
  colorPaperDark      = "#0C1724"
  colorSurfaceDark    = "#141E2F"
  colorSurfaceAltDark = "#1B2740"
  colorBorderDark     = "#1F2C44"
  colorBorderStrongDark = "#2A3A56"

  # ---- Repo / edit-on-github (left blank — fill when published) ----
  editURL = ""
  repoURL = ""

  versionBadgeRepo  = "FHDumont/vega-concierge"
  versionBadgeColor = "FF007F"

  [params.social]
    github = "https://github.com/FHDumont/vega-concierge"
    rss    = "/index.xml"
