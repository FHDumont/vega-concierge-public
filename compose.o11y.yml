name: vega
# Override de observabilidade — aplica SOBRE compose.plain.yml ou docker-compose.yml:
#   ./scripts/up.sh --o11y
#   ./scripts/up.sh --build --o11y
# Sobe o OTel Collector e recria o backend com opentelemetry-instrument (sem alterar app/).
services:
  backend:
    command:
      [
        "opentelemetry-instrument",
        "uvicorn",
        "app.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-vega-concierge}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      - OTEL_TRACES_EXPORTER=${OTEL_TRACES_EXPORTER:-otlp}
      - OTEL_METRICS_EXPORTER=${OTEL_METRICS_EXPORTER:-otlp}
      - OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE=${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:-delta}
      - OTEL_LOGS_EXPORTER=${OTEL_LOGS_EXPORTER:-otlp}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=${DEPLOYMENT_ENVIRONMENT:-user-local}}
      - SPLUNK_PROFILER_ENABLED=${SPLUNK_PROFILER_ENABLED:-true}
      - OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED=${OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED:-false}
      - OTEL_PYTHON_LOG_CORRELATION=${OTEL_PYTHON_LOG_CORRELATION:-true}
      # Captura 100%: SPAN_AND_EVENT manda conteúdo pro span E emite content-event (log record) —
      # é o log record que chega no pipeline de logs do Collector → Splunk platform (HEC).
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-SPAN_AND_EVENT}
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT_MODE=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT_MODE:-SPAN_AND_EVENT}
      - OTEL_INSTRUMENTATION_GENAI_EMITTERS=${OTEL_INSTRUMENTATION_GENAI_EMITTERS:-span_metric_event,splunk}
      - OTEL_INSTRUMENTATION_GENAI_CONTEXT_PROPAGATION=${OTEL_INSTRUMENTATION_GENAI_CONTEXT_PROPAGATION:-true}
      - OTEL_INSTRUMENTATION_GENAI_CAPTURE_TOOL_DEFINITIONS=${OTEL_INSTRUMENTATION_GENAI_CAPTURE_TOOL_DEFINITIONS:-true}
      - OTEL_INSTRUMENTATION_GENAI_ROOT_SPAN_AS_WORKFLOW=${OTEL_INSTRUMENTATION_GENAI_ROOT_SPAN_AS_WORKFLOW:-true}
      # gen_ai.conversation.id só — NÃO usar "all" (explode cardinalidade/custo de métricas).
      - OTEL_INSTRUMENTATION_GENAI_CONTEXT_INCLUDE_IN_METRICS=${OTEL_INSTRUMENTATION_GENAI_CONTEXT_INCLUDE_IN_METRICS:-gen_ai.conversation.id}
      - SPLUNK_EVALUATION_RESULTS_MESSAGE_CONTENT=${SPLUNK_EVALUATION_RESULTS_MESSAGE_CONTENT:-true}
      # Evals Deepeval (LLM-as-a-judge) — cada avaliação chama o juiz configurado, custa $ por invocação.
      - OTEL_INSTRUMENTATION_GENAI_EVALS_EVALUATORS=${OTEL_INSTRUMENTATION_GENAI_EVALS_EVALUATORS:-Deepeval(LLMInvocation(bias,toxicity,hallucination,relevance,sentiment))}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_INTERVAL=${OTEL_INSTRUMENTATION_GENAI_EVALS_INTERVAL:-5.0}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_QUEUE_SIZE=${OTEL_INSTRUMENTATION_GENAI_EVALS_QUEUE_SIZE:-500}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_CONCURRENT=${OTEL_INSTRUMENTATION_GENAI_EVALS_CONCURRENT:-true}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_WORKERS=${OTEL_INSTRUMENTATION_GENAI_EVALS_WORKERS:-4}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_USE_SINGLE_METRIC=${OTEL_INSTRUMENTATION_GENAI_EVALS_USE_SINGLE_METRIC:-false}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_MONITORING=${OTEL_INSTRUMENTATION_GENAI_EVALS_MONITORING:-true}
      - OTEL_INSTRUMENTATION_GENAI_EVALS_RESULTS_AGGREGATION=${OTEL_INSTRUMENTATION_GENAI_EVALS_RESULTS_AGGREGATION:-true}
      - OTEL_INSTRUMENTATION_GENAI_EVALUATION_SAMPLE_RATE=${OTEL_INSTRUMENTATION_GENAI_EVALUATION_SAMPLE_RATE:-1.0}
      - OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_ENABLE=${OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_ENABLE:-true}
      - OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_RPS=${OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_RPS:-1}
      - OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_BURST=${OTEL_INSTRUMENTATION_GENAI_EVALUATION_RATE_LIMIT_BURST:-4}
      - DEEPEVAL_EVALUATION_MODEL=${DEEPEVAL_EVALUATION_MODEL:-gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPEVAL_TELEMETRY_OPT_OUT=${DEEPEVAL_TELEMETRY_OPT_OUT:-1}
      # Upload hook — opcional, off por padrão (exige destino fsspec configurado pelo dono).
      - OTEL_INSTRUMENTATION_GENAI_UPLOAD_HOOK=${OTEL_INSTRUMENTATION_GENAI_UPLOAD_HOOK:-}
      - OTEL_INSTRUMENTATION_GENAI_UPLOAD_BASE_PATH=${OTEL_INSTRUMENTATION_GENAI_UPLOAD_BASE_PATH:-}
    depends_on: [otel-collector]

  otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:latest
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - SPLUNK_O11Y_REALM=${SPLUNK_O11Y_REALM:-us1}
      - SPLUNK_O11Y_TOKEN=${SPLUNK_O11Y_TOKEN:-}
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN:-}
      - SPLUNK_HEC_URL=${SPLUNK_HEC_URL:-}
