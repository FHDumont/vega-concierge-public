[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# Default = offline: nada de rede nem credencial. `live` (Bedrock real) e `ollama` (exigem o
# Ollama do host) só rodam quando pedidos explicitamente: `pytest -m live`, `pytest -m ollama`.
addopts = -m "not live and not ollama"
markers =
    live: chama provider real (exige credencial); fora do run default
    bedrock: específico de Amazon Bedrock
    ollama: exige o Ollama do host respondendo; fora do run default
    trace_audit: diagnóstico F-WORKSHOP-RAG-1 tool/RAG vs Galileo Console
