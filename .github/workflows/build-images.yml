# F-034 / F-DEPLOY-PROD-1 — Build & push of the Docker images (backend + frontend) via CI.
# CalVer Cortex-style (ADR-036): tag YYYY.MM.DD-<sha> on main, v* on release, latest on main.
# Principle (CONVENCOES › "Docker image builds — CI only"): images are built
# ONLY here (GitHub Actions), multi-arch (amd64 + arm64), and published to GHCR. The environments
# (Mac mini, Splunk Show VMs/AMI) PULL them — never a local `docker build` in the run flow.
name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # F-035: on main, builds only when code changes (not on docs/scripts-only commits).
    # Explicit allowlist (CONVENCOES › prefer allowlist over paths-ignore). Doesn't affect
    # v* tag pushes (paths doesn't filter tag pushes) or workflow_dispatch — both always build.
    paths:
      - "backend/**"
      - "frontend/**"
      - "**/Dockerfile"
      - "docker-compose*.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

# Minimal permissions to publish to the GitHub Container Registry with GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: vega-backend
          - name: frontend
            context: ./frontend
            image: vega-frontend
          # F-041: OPTIONAL backend variant with Playwright+Chromium (simulator Browser
          # mode, F-039/ADR-022) for the Mac mini to generate real RUM sessions. Large image
          # (Chromium) — the run compose only uses it when BACKEND_IMAGE=vega-backend-browser.
          - name: backend-browser
            context: ./backend
            image: vega-backend-browser
            dockerfile: Dockerfile.browser
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR requires a lowercase owner in the image path.
      - name: Resolve image name (lowercase owner)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Compute CalVer version (ADR-036)
        id: ver
        run: |
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            # v2026.08.05 → 2026.08.05 (CalVer without the v prefix)
            VEGA_VERSION="${TAG#v}"
          else
            CALVER="$(date -u +%Y.%m.%d)"
            VEGA_VERSION="${CALVER}-${SHA}"
          fi
          echo "vega_version=${VEGA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: CalVer (+sha on main) · short SHA · latest (main) · git tag (v* releases).
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.vega_version }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build & push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          # Alternate Dockerfile for variants (e.g. backend-browser → Dockerfile.browser).
          file: ${{ matrix.context }}/${{ matrix.dockerfile || 'Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VEGA_VERSION=${{ steps.ver.outputs.vega_version }}
            VEGA_GIT_SHA=${{ steps.ver.outputs.git_sha }}
            VEGA_BUILD_DATE=${{ steps.ver.outputs.build_date }}
            NEXT_PUBLIC_VEGA_VERSION=${{ steps.ver.outputs.vega_version }}
            NEXT_PUBLIC_VEGA_GIT_SHA=${{ steps.ver.outputs.git_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
