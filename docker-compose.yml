# Vega Concierge — workshop stack (1 VM per attendee)
# `name` fixed and IDENTICAL to compose.plain.yml's: without it the project would default to
# the directory name (`vega-concierge`) and dev.sh would coexist with up.sh's stack — two
# pgvector instances, two volumes, and one's postgres holding :5434 from the other.
name: vega
services:
  backend:
    build: ./backend
    # Single per-VM config contract (F-BACKEND-3, Stage B): the root `.env` is the
    # canonical source, injected here via `env_file` — the same file that `scripts/*.sh` and
    # Ansible write to. `environment:` below is only for values that need to be DIFFERENT
    # inside the container (`environment:` wins over `env_file`, so these overrides stay
    # immune to whatever is in `.env`).
    env_file:
      - path: .env
        required: false
    environment:
      - ORDERS_DB=/data/vega.db  # SQLite on a named volume (DT-006): survives container recreation
      - VEGA_PERSIST_DIR=/persist
      # RAG (ADR-031): internal URL @postgres — host/setup_vectordb uses localhost in .env.
      - RAG_DATABASE_URL=postgresql+psycopg://${RAG_DB_USER:-vega}:${RAG_DB_PASSWORD:-vega}@postgres:5432/${RAG_DB_NAME:-vega_rag}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RAG_ENABLED=${RAG_ENABLED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8000:8000"]
    volumes:
      - vega-db:/data
      - ./backend/.vega-persist:/persist

  frontend:
    build: ./frontend
    environment:
      # Separate (ADR-024): the browser talks directly to the API. In dev the browser is on the HOST →
      # uses the backend's published port (localhost:8000). API_INTERNAL_URL is for SSR to reach
      # the backend via compose DNS (`backend:8000`).
      - PUBLIC_API_BASE=${PUBLIC_API_BASE:-http://localhost:8000}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://backend:8000}
    ports: ["3000:3000"]
    depends_on: [backend]

  # pgvector — real embeddings for RAG (ADR-031). Profile `rag`: does NOT join the default stack,
  # because the in-process keyword retriever already works with no database at all. Stores only
  # vectors; transactional state stays in SQLite (ADR-008).
  postgres:
    profiles: [rag]
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${RAG_DB_USER:-vega}
      - POSTGRES_PASSWORD=${RAG_DB_PASSWORD:-vega}
      - POSTGRES_DB=${RAG_DB_NAME:-vega_rag}
    # Local dev: publishes loopback for setup_vectordb on the host (dev.sh). Production: no ports (compose.plain.yml).
    ports: ["127.0.0.1:${RAG_DB_PORT:-5434}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-vega} -d ${RAG_DB_NAME:-vega_rag}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    volumes:
      - vega-vectors:/var/lib/postgresql/data

volumes:
  vega-db:  # persistence for the orders SQLite across container recreations (DT-006)
  vega-vectors:  # pgvector embeddings (profile `rag`)
